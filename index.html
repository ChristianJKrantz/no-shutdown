@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:800;font-display:swap;src:url(fonts/inter-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#010804; --panel:#03110a; --panel2:#06190e; --line:#0f3a20; --text:#d4ffe2; --muted:#5f9f76;
  --accent:#00ff66; --accent2:#4dffd0; --good:#39ff7a; --bad:#ff4f68; --warn:#ffd23d;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--accent)}
.mono{font-family:var(--mono)}.dim{color:var(--muted)}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.2}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(to bottom,#00000000 0 2px,#0000002e 3px 3px);mix-blend-mode:multiply}
.app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:20px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
h1{margin:0;font:800 30px var(--mono);letter-spacing:0;text-shadow:0 0 12px #00ff6659;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 span{color:var(--accent);text-shadow:0 0 14px #00ff66a6}
h1 .cur::after{content:"_";color:var(--accent);animation:blink 1.1s steps(1) infinite;margin-left:-6px}
@keyframes blink{50%{opacity:0}}
.sub{color:var(--muted);font:14px var(--mono);margin-top:4px}
.sister{font:600 13px Inter,system-ui,sans-serif;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;white-space:nowrap}
.sister:hover{border-color:var(--accent)}
.install{font:600 13px Inter,system-ui,sans-serif;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:999px;padding:5px 12px}
@media (display-mode:standalone){.install{display:none!important}}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#03110aeb;border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:84px;text-align:center}
.stat b{display:block;font:700 20px var(--mono)}.stat small{color:var(--muted);font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 14px var(--mono);color:var(--muted)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#001a0a;box-shadow:0 0 14px #00ff6655}
.card{background:#03110aeb;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 0 0 1px #00ff6612,0 0 24px #00ff660a}
h2{font:700 20px var(--mono);margin:0 0 6px}
h3{font:700 15px var(--mono);margin:16px 0 8px;color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:600 14px var(--mono)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#001a0a;border-color:var(--accent);box-shadow:0 0 14px #00ff6655}
.btn.small{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font:600 12px var(--mono);color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}

/* terminal */
.term{background:#000;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.tout{font:14px/1.5 var(--mono);padding:12px 14px 4px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;flex:1 1 auto;min-height:220px;max-height:58vh}
.tout .cmd{color:var(--text)}.tout .cmd .p{color:var(--accent)}
.tout .out{color:#b9e8c8}.tout .err{color:var(--bad)}
.tout .coach{display:block;color:var(--warn);background:#ffd23d12;border-left:3px solid var(--warn);padding:4px 10px;margin:4px 0 6px;border-radius:0 6px 6px 0;font-family:Inter,system-ui,sans-serif;white-space:normal}
.tout .coach::before{content:"💡 "}
.tout .sys{color:var(--muted);font-style:italic}
.tin{display:flex;align-items:center;gap:8px;padding:6px 14px 12px}
.tin .tp{color:var(--accent);font:14px var(--mono);white-space:nowrap}
.tin input{flex:1 1 auto;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:14px var(--mono);padding:4px 0;caret-color:var(--accent)}
.tkeys{display:none;gap:6px;padding:0 10px 10px;flex-wrap:wrap}
.tkeys button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 13px var(--mono)}

/* drills */
.drill{max-width:820px}
.dpurpose{font:600 20px/1.4 Inter,system-ui,sans-serif;margin:10px 0 14px}
.dmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font:13px var(--mono)}
.dbox{background:#000;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.dbox .tp{color:var(--accent);font:16px var(--mono);white-space:nowrap}
.dbox input{flex:1 1 auto;min-width:0;background:transparent;border:0;outline:0;font:16px var(--mono);color:var(--text)}
.dfb{margin-top:12px;min-height:24px}
.dfb .out{font:13px/1.5 var(--mono);white-space:pre-wrap;color:var(--bad)}
.dfb .ok{color:var(--good);font-weight:700}
.dfb .coach{color:var(--warn)}
.dacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.groups{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.ans{font:15px var(--mono);color:var(--accent)}

/* tasks */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{text-align:left;background:#03110aeb;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tcard:hover{border-color:var(--accent)}
.tcard b{font:700 15px var(--mono)}.tcard small{color:var(--muted);font:12px var(--mono)}
.tcard .lvl{color:var(--accent2);font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.tcard .done{color:var(--accent);font:13px var(--mono)}
.tview{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}.tview>*{min-width:0}
.tside{position:sticky;top:12px}
.goals{list-style:none;padding:0;margin:10px 0}
.goals li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.goals li i{flex:0 0 20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;margin-top:1px;font-style:normal;text-align:center;line-height:18px;font-size:13px;color:#001a0a}
.goals li.ok{color:var(--muted)}.goals li.ok i{background:var(--accent);border-color:var(--accent)}.goals li.ok i::after{content:"✓"}
.goals li.pop i{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.35)}}
.goals li .dv{font:600 11px var(--mono);color:var(--accent2);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;white-space:nowrap}
.given{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.given td,.given th{border-top:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}.given th{color:var(--muted);font:600 11px var(--mono);text-transform:uppercase}
.given td.v{font-family:var(--mono);color:var(--accent)}
.tablewrap{overflow-x:auto}.ttable{margin-top:14px}.tablewrap .given{font-size:12px}.tablewrap .given td,.tablewrap .given th{padding:4px 4px;white-space:nowrap}.tablewrap .given td.v{letter-spacing:-.02em}
.showme{background:#000;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font:13px/1.6 var(--mono)}
.showme ol{margin:4px 0 0 18px;padding:0}.showme li{color:var(--accent)}
.dtabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.dtabs button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:600 13px var(--mono);color:var(--muted)}
.dtabs button.on{color:var(--accent);border-color:var(--accent)}
.ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.4em;flex:none}.ico svg{width:100%;height:100%;display:block}
.pcpanel .pct{display:flex;gap:6px;margin-bottom:8px}
.ipform{display:grid;grid-template-columns:auto minmax(0,260px);gap:10px 12px;align-items:center;background:#000;border:1px solid var(--line);border-radius:12px;padding:16px}
.ipform label{color:var(--muted);font:13px var(--mono)}
.ipform input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:15px var(--mono)}
.ipform input:focus{outline:0;border-color:var(--accent)}
.done-banner{border:1px solid var(--accent);background:#00ff6614;border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 0 18px #00ff6633}
.done-banner b{color:var(--accent)}.stars{color:var(--warn);letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nextgoal{font-size:14px;margin:0 0 10px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--text)}.nextgoal b{color:var(--accent);font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-right:6px}.nextgoal .dv{color:var(--accent2);font:12px var(--mono)}
.tab{white-space:nowrap}

/* cheat sheet */
.cheat table{width:100%;border-collapse:collapse;font-size:14px}
.cheat td{border-top:1px solid var(--line);padding:7px 8px;vertical-align:top}
.cheat td:first-child{font-family:var(--mono);color:var(--accent);width:50%}
.cheat td:nth-child(2){font-family:var(--mono);color:var(--accent2);white-space:nowrap}
.modes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:13px var(--mono);margin:6px 0 4px}
.modes span{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#000}.modes span b{color:var(--accent)}
.modes em{color:var(--muted);font-style:normal}
footer{margin:26px 0 10px;color:var(--muted);font-size:13px;text-align:center}

@media (max-width:900px){
  .tview{grid-template-columns:minmax(0,1fr)}.tside{position:static}
}
@media (max-width:600px){
  .app{padding:12px}
  h1{font-size:24px}
  .stat{min-width:0;flex:1 1 0;padding:5px 6px}.stat b{font-size:17px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .card{padding:14px}
  .tout{font-size:13px;min-height:200px;max-height:52vh;padding:10px 10px 4px}
  .tin{padding:6px 10px 10px}.tin .tp,.tin input{font-size:13px}
  .tkeys{display:flex}
  .dpurpose{font-size:18px}
  .dbox{flex-wrap:wrap}.dbox .tp{font-size:14px}.dbox input{font-size:16px;flex-basis:100%}
  .ipform{grid-template-columns:1fr}
  .cheat td{display:block;width:auto!important;border-top:0;padding:2px 0}.cheat tr{display:block;border-top:1px solid var(--line);padding:6px 0}
}
@media (prefers-reduced-motion:reduce){h1 .cur::after{animation:none}}

/* ---------- Packet Tracer lab ---------- */
.lab .groups{margin:12px 0 4px}
.nd-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.nd-ctl{gap:10px;margin-bottom:8px}.nd-ctl .groups{margin:0}
.nd-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}.nd-ev{width:100%}.nd-ev tr[tabindex]{cursor:pointer}.nd-ev tr.on td{background:#00ff6626}.nd-ev tr:hover td{background:#00ff6612}
.nd-type{font:600 11px var(--mono);padding:2px 6px;border-radius:4px;background:#4dffd022;color:var(--accent2)}.nd-ev tr.icmp .nd-type{background:#00ff6622;color:var(--accent)}
.nd-pdu{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}.nd-pdu-h{font:600 12px var(--mono);color:var(--accent);margin-bottom:4px}.nd-lay{margin-top:8px}.nd-lay>div{margin:3px 0 0 8px;overflow-wrap:anywhere}.nd-lay .k{color:var(--muted);font:11px var(--mono)}.nd-lay .warn{color:var(--warn)}
.nd-q .nd-part{list-style:none;margin:16px 0 8px -22px;font:600 12px var(--mono);color:var(--accent2);letter-spacing:.04em}
@media (max-width:900px){.nd-grid{grid-template-columns:minmax(0,1fr)}}
.tquestions{padding-left:22px;margin:6px 0 12px}.tquestions li{margin:0 0 12px;font-size:14px}.tquestions li.ok .tq-t{color:var(--muted);text-decoration:line-through}.tquestions li.ok input,.tquestions li.ok .btn{opacity:.5}
.tquestions .row{margin-top:6px}.tquestions input{flex:1;min-width:140px;background:#000;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);font:14px var(--mono)}
.tq-fb{font-size:13px;margin-top:4px}.tq-hints{margin-top:6px}.tq-hint{font-size:13px;border-left:2px solid var(--accent2);padding:3px 0 3px 10px;margin:4px 0;color:var(--text)}.tq-hint b{color:var(--accent2);font-weight:600}.tq-hint.ans{border-color:var(--warn)}.tq-hint.ans b{color:var(--warn)}.tq-hint code,.nd-part code{font:12px var(--mono);color:var(--accent)}
.tquestions li.ok.helped .tq-t{text-decoration-color:var(--warn)}.tquestions li.ok .tq-hints{display:none}.tq-fb.good{color:var(--good)}.tq-fb.bad{color:#ffb3bf}.tq-fb.coach{color:var(--warn)}
.lab .labkind{margin:0 0 14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}.lab .labkind .chip{font-size:14px;padding:8px 14px}
.lab-req{margin:8px 0 4px;padding-left:20px}.lab-req li{margin:2px 0}
.lab-q .dbox.picks{display:block;background:none;border:0;padding:0}.lab-picks{display:flex;flex-wrap:wrap;gap:8px;margin:0}.lab-picks .chip{font-size:14px;padding:8px 14px}
.lab-prompt{font:16px/1.55 Inter,system-ui,sans-serif;margin:12px 0 2px}.lab-prompt .big{font:700 22px var(--mono);color:var(--accent);text-shadow:0 0 10px #00ff6655}
.lab-prompt b{color:var(--accent2)}
.topo{display:block;width:100%;max-width:640px;height:auto;margin:12px 0 4px}
.topo .tl{stroke:var(--accent);stroke-opacity:.55;stroke-width:2;fill:none}.topo .tl.wan{stroke:var(--accent2);stroke-dasharray:6 4;stroke-opacity:.9}
.topo .trt{fill:var(--panel2);stroke:var(--accent);stroke-width:2}.topo .tsw{fill:var(--panel2);stroke:var(--accent2);stroke-width:1.5}.topo .tpc{fill:var(--panel2);stroke:var(--muted);stroke-width:1.5}
.topo .tn{fill:var(--text);font:600 13px var(--mono)}.topo .tt{fill:var(--muted);font:12px var(--mono)}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:12px}

.lab-prog{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.lab-prog i{display:block;height:100%;background:var(--accent)}
.lab-fb .bad{color:#ffb3bf;font:14px/1.5 Inter,system-ui,sans-serif}.lab-fb .coach{color:var(--warn);font-size:14px}
.lab-fb .g{color:var(--good)}.lab-hints{margin:8px 0 0;padding-left:20px;font:14px/1.5 Inter,system-ui,sans-serif}.lab-hints li{margin:4px 0}
.dim{color:var(--muted)}
.fsheet{background:#000a;border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.fs-sec{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.fs-row{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px dashed #ffffff12;font-size:13.5px}.fs-row:last-child{border-bottom:0}.fs-row b{color:var(--accent)}
.fs-row.miss b,.fs-cv.miss{color:#ffe08a}
.fs-chart{border-collapse:collapse;width:100%;font-size:13px}.fs-chart th{color:var(--muted);font:600 11px var(--mono);text-align:left;padding:3px 6px}
.fs-chart td{padding:5px 6px;border-top:1px solid var(--line);font-family:var(--mono);white-space:nowrap}
.fs-rl{color:var(--muted)}.fs-cv{color:var(--accent)}.fs-cv.pop{animation:pop .5s}@keyframes pop{0%{text-shadow:0 0 14px var(--accent)}}

.ips{display:none}

.own{margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:12px}.own-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.own-msg{margin-top:8px;font-size:14px}.own-msg.bad{color:var(--bad)}
.lab-key{font:12px var(--mono);display:inline-flex;align-items:center;gap:4px}

@media print{

.drill-picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 18px;font:600 14px var(--mono)}
.drill-picker select{background:#06190e;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:44px;font:inherit;max-width:100%}
.dbox:focus-within{border-color:var(--accent)}
@media(max-width:600px){.drill-picker select{flex:1;min-width:0}.dacts .btn,.tabs button{min-height:44px}.drill .dbox{border-left:3px solid var(--accent);border-radius:4px}}
@media(max-width:600px){.tabs{flex-wrap:wrap;overflow:visible;gap:4px}.tabs button{flex:1 0 auto;text-align:center}}
@media screen {
:root{--bg:#132722;--panel:#1d342d;--panel2:#263f36;--line:#466253;--text:#f0f3e7;--muted:#b6c7b6;--accent:#c2f65b}
html,body{background:#eeeae1}body::after,#rain{display:none}
.app{max-width:1180px;padding:clamp(12px,2.4vw,32px)}
.app>header{align-items:center;background:#efece2;color:#192d25;padding:12px 0 18px;border-bottom:2px solid #21372e;gap:16px}

h1 .cur,h1 .cur span{color:#19372a;text-shadow:none}h1 .cur::after{display:none}.brand-mark{width:1em;height:1em;border-radius:.17em}
header .sub{font:500 15px/1.4 Inter,system-ui,sans-serif;color:#43574b;margin-top:8px}
header .row{gap:10px}header .sister{color:#294b35;background:transparent;border-color:#9cae9d}header .stat{background:transparent;color:#142b20;border:0;border-radius:0;border-left:1px solid #abb5a6;min-width:0;padding:4px 12px}header .stat small{color:#4b6051}
.tabs{gap:4px;margin:12px 0}.tabs .tab{border:1px solid #b1bcad;color:#304734;background:#f6f4ec;border-radius:6px;line-height:1.2}.tabs .tab.on{color:#f7faed;background:#203e2e;border-color:#203e2e;box-shadow:none}
.app>main{color:var(--text)}.app>main>.card,.app>main>#v-tasks{background:#1b3028;border:1px solid #314f40;border-radius:14px;box-shadow:0 10px 24px #20342419}.app>main>#v-tasks{padding:16px}
#v-drills{max-width:none;padding:clamp(18px,3.5vw,44px)}.drill .dmeta{color:#c5d9bb}.drill-picker{padding-bottom:14px;border-bottom:1px solid #45604e}
.dpurpose{font-size:clamp(23px,3vw,38px);letter-spacing:-.04em;line-height:1.16;max-width:30ch;margin:18px 0}.dbox{background:#102219;border:1px solid #76936e;border-left:4px solid var(--accent);border-radius:6px;min-height:58px}.dbox .tp{color:var(--accent)}.dbox input{color:#fcfff3}
.dacts .btn,.btn.primary{box-shadow:none;border-radius:6px}.btn.primary{background:var(--accent);color:#18281a;border-color:var(--accent)}
.app>footer{color:#405446}.app>footer a{color:#21482f}.term{border-radius:6px}
@media(min-width:820px){#v-drills{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,28%);column-gap:36px}#v-drills[hidden]{display:none}#v-drills>*{grid-column:1}#v-drills>.drill-picker{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:stretch;align-self:start;margin:0;padding:16px;background:#294237;border:1px solid #496554;border-radius:8px}.drill .dpurpose{grid-row:2}}
@media(max-width:600px){header .row{width:100%;justify-content:space-between}.app>header{padding-top:6px;margin-bottom:8px}.tabs{margin:8px 0}.drill .dpurpose{margin:14px 0}.drill .drill-picker{margin:8px 0}.drill .dbox{gap:5px}.app>main>#v-tasks{padding:10px}}
}
@media screen{
  .tin{flex-wrap:wrap}
  .tin .tp{max-width:100%;white-space:normal;overflow-wrap:anywhere}
  .tin input{flex:1 1 12ch;min-width:min(12ch,100%)}
}

/* ---------- learning path ---------- */
#v-path{padding:clamp(18px,3.5vw,40px);max-width:none}
.pathv h2{font:800 clamp(24px,3vw,34px)/1.1 Inter,system-ui,sans-serif;letter-spacing:-.03em;margin:4px 0 0}
.pl-kicker{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.pl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.pl-streak{text-align:center;min-width:86px;flex:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.pl-streak b{display:block;font:700 26px/1 var(--mono);color:var(--warn)}.pl-streak small{font:11px var(--mono);color:var(--muted)}
.pl-start{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:14px 18px;border-radius:8px;text-align:left;font:800 clamp(20px,2.6vw,26px)/1.15 Inter,system-ui,sans-serif;letter-spacing:-.02em;box-shadow:none}
.pl-start small{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.pl-map{list-style:none;margin:18px 0 0;padding:0 0 0 22px;position:relative;display:grid;gap:8px}
.pl-map::before{content:"";position:absolute;left:8px;top:16px;bottom:16px;width:2px;background:repeating-linear-gradient(var(--accent) 0 6px,transparent 6px 11px);opacity:.5}
.pl-node{position:relative}
.pl-node::before{content:"";position:absolute;left:-19px;top:24px;width:10px;height:10px;border-radius:2px;background:var(--panel);border:2px solid var(--accent)}
.pl-node.locked::before{border-color:var(--line)}.pl-node.next::before{background:var(--accent);box-shadow:0 0 0 4px #c2f65b33}.pl-node.due::before{background:var(--warn);border-color:var(--warn)}
.pl-node>button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);min-height:54px;font:inherit}
.pl-node>button:hover:not(:disabled){border-color:var(--accent)}
.pl-node.next>button{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pl-node.locked>button{opacity:.55;cursor:not-allowed}
.pl-num{font:13px var(--mono);color:var(--muted);width:22px}
.pl-txt{flex:1;min-width:0}.pl-txt b{display:block;font-size:15px}.pl-txt small{color:var(--muted);font-size:12.5px}
.pl-node.due .pl-txt small{color:var(--warn)}
.pl-bars{display:inline-flex;align-items:flex-end;gap:2px;height:20px}.pl-bars i{display:block;width:5px;border-radius:1px;background:#466253}.pl-bars i.on{background:var(--accent)}
.pl-cps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px 34px}
.pl-cp{background:transparent;border:1px dashed var(--line);border-radius:6px;padding:6px 10px;font:600 12.5px var(--mono);color:var(--accent);min-height:36px}
.pl-cp.done{border-style:solid;color:var(--muted)}.pl-cp:hover{border-color:var(--accent)}
.pl-note{color:var(--muted);font-size:13px;margin:16px 0 0;line-height:1.5}
.pl-free{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.pl-free p{margin:6px 0 10px;font-size:14px}
.pl-back{background:none;border:0;color:var(--accent);font:600 14px var(--mono);padding:4px 0;margin-bottom:8px;min-height:32px}
.pl-body{margin:14px 0 6px;max-width:64ch;font-size:16px;line-height:1.55}.pl-body p{margin:0 0 10px}.pl-body ul{margin:0 0 10px;padding-left:22px}.pl-body li{margin:3px 0}
.pl-con{background:#0b1813;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px;margin:8px 0 12px;font:14px/1.6 var(--mono);overflow-x:auto;white-space:pre}
.pl-con .p{color:var(--accent);margin-right:.5ch}.pl-con .o{color:var(--muted)}
.pl-steps{display:flex;gap:5px;margin-top:12px}.pl-steps i{flex:1;height:4px;border-radius:2px;background:#466253}.pl-steps i.done{background:var(--muted)}.pl-steps i.on{background:var(--accent)}
.pl-q{font-weight:600;font-size:17px}.pl-opts{display:grid;gap:8px;margin:8px 0}.pl-opt{text-align:left;min-height:46px;font:600 14px var(--mono)}
.pl-opt.ok{border-color:var(--good);background:#21452f}.pl-opt.no{border-color:var(--bad);opacity:.6;text-decoration:line-through}
.pl-why{min-height:1.5em;font-size:15px}.pl-why.good{color:var(--good)}.pl-why.bad{color:#ffb3bd}
.pl-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.pl-actions .btn{min-height:44px}
.pl-run{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid #45604e}.pl-run .pl-back{margin:0;font-size:18px;width:32px}
.pl-runtxt{min-width:0}.pl-runtxt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl-runtxt small{color:var(--muted);font:12px var(--mono)}
.pl-prog{flex:1;height:8px;border-radius:4px;background:#2c4338;overflow:hidden;min-width:60px}.pl-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pl-unitbars{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:10px 0;flex-wrap:wrap}
.pl-score b{font:700 40px var(--mono);color:var(--accent);margin-right:6px}.pl-score span{color:var(--muted)}
.pl-unlock{color:var(--accent);margin:6px 0 0;font-weight:600}
@media(max-width:700px){body.pl-focus .app>header,body.pl-focus .tabs{display:none}.pl-run .pl-bars{display:none}}
@media(prefers-reduced-motion:reduce){.pl-prog i{transition:none}}
@media print{#v-path{display:none!important}}
</style>
</head>
